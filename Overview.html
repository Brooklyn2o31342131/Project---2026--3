<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Home Bank — Personal Banking</title>
</head>
<body>
    <div>
        <main>
            <header>
                <div>
                    <h1>Good morning, User</h1>
                </div>
                <time id="today-label"></time>
            </header>

            <section aria-label="Financial summary">
                <article class="summary-card balance"><div class="card-label">Current balance <span class="mini-icon">&#8599;</span></div><p class="card-value" id="balance">€0.00</p><p class="trend" id="balance-trend">Ready for your first entry</p></article>
                <article class="summary-card"><div class="card-label">Income this month <span class="mini-icon">&#8595;</span></div><p class="card-value" id="income">€0.00</p><p class="trend" id="income-trend">No income yet</p></article>
                <article class="summary-card"><div class="card-label">Expenses this month <span class="mini-icon">&#8593;</span></div><p class="card-value" id="expenses">€0.00</p><p class="trend" id="expense-trend">No expenses yet</p></article>
            </section>

            <section>
                <article class="panel transactions-panel" id="transactions">
                    <div class="panel-header"><h2>Recent transactions</h2><select class="filter" id="transaction-filter" aria-label="Filter transactions"><option value="all">All activity</option><option value="income">Income</option><option value="expense">Expenses</option></select></div>
                    <div class="transaction-list" id="transaction-list"><div class="empty" id="empty-state">No transactions here yet.</div></div>
                </article>

                <article id="transaction-form">
                    <h2>Add a transaction</h2>
                    <div class="form-tabs" role="tablist" aria-label="Transaction type"><button class="tab active" type="button" data-type="income" role="tab" aria-selected="true">Add income</button><button class="tab" type="button" data-type="expense" role="tab" aria-selected="false">Add expense</button></div>
                    <form id="transaction-entry">
                        <label for="description">What is it for?</label><input id="description" name="description" type="text" placeholder="e.g. Freelance work" required>
                        <label for="amount">Amount</label><div class="amount-input"><span>€</span><input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div>
                        <label for="category">Category</label><select id="category" name="category"><option>Salary</option><option>Freelance</option><option>Housing</option><option>Food</option><option>Transport</option><option>Fun</option><option>Other</option></select>
                        <label for="date">Date</label><input id="date" name="date" type="date" required>
                        <div class="notice" id="form-notice" role="status"></div>
                        <button class="submit-btn" type="submit" id="submit-button">Add income</button>
                    </form>
                </article>
            </section>
        </main>
    </div>

    <script>
        (() => {
            const entries = [];
            let activeType = 'income';
            const currency = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' });
            const list = document.querySelector('#transaction-list');
            const form = document.querySelector('#transaction-entry');
            const dateInput = document.querySelector('#date');
            const today = new Date();
            const todayValue = today.toISOString().slice(0, 10);

            dateInput.value = todayValue;
            document.querySelector('#today-label').textContent = today.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });

            const escapeHtml = value => value.replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);

            const updateSummary = () => {
                const income = entries.filter(entry => entry.type === 'income').reduce((sum, entry) => sum + entry.amount, 0);
                const expenses = entries.filter(entry => entry.type === 'expense').reduce((sum, entry) => sum + entry.amount, 0);
                document.querySelector('#balance').textContent = currency.format(income - expenses);
                document.querySelector('#income').textContent = currency.format(income);
                document.querySelector('#expenses').textContent = currency.format(expenses);
                document.querySelector('#balance-trend').textContent = entries.length ? `${entries.length} transaction${entries.length === 1 ? '' : 's'} tracked` : 'Ready for your first entry';
                document.querySelector('#income-trend').textContent = income ? 'Income recorded this month' : 'No income yet';
                document.querySelector('#expense-trend').textContent = expenses ? 'Expenses recorded this month' : 'No expenses yet';
            };

            const render = () => {
                const filter = document.querySelector('#transaction-filter').value;
                const visibleEntries = entries.filter(entry => filter === 'all' || entry.type === filter);
                list.innerHTML = visibleEntries.length ? visibleEntries.map(entry => `<div class="transaction"><span class="transaction-icon ${entry.type === 'expense' ? 'expense' : ''}">${entry.type === 'income' ? '&#8595;' : '&#8593;'}</span><div><div class="transaction-name">${escapeHtml(entry.description)}</div><div class="transaction-meta">${escapeHtml(entry.category)} · ${escapeHtml(entry.date)}</div></div><span class="amount ${entry.type}">${entry.type === 'income' ? '+' : '-'}${currency.format(entry.amount)}</span><button class="delete-btn" type="button" data-id="${entry.id}" aria-label="Delete ${escapeHtml(entry.description)}">&#10005;</button></div>`).join('') : `<div class="empty">${entries.length ? 'No transactions match this filter.' : 'No transactions here yet.'}</div>`;
                updateSummary();
            };

            document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
                activeType = tab.dataset.type;
                document.querySelectorAll('.tab').forEach(item => { item.classList.toggle('active', item === tab); item.setAttribute('aria-selected', item === tab); });
                document.querySelector('#submit-button').textContent = activeType === 'income' ? 'Add income' : 'Add expense';
            }));

            form.addEventListener('submit', event => {
                event.preventDefault();
                const data = new FormData(form);
                entries.unshift({ id: Date.now(), type: activeType, description: data.get('description').trim(), amount: Number(data.get('amount')), category: data.get('category'), date: data.get('date') });
                form.reset();
                dateInput.value = todayValue;
                render();
                document.querySelector('#form-notice').textContent = 'Transaction added successfully.';
                document.querySelector('#form-notice').classList.add('visible');
                window.setTimeout(() => document.querySelector('#form-notice').classList.remove('visible'), 2200);
            });

            document.querySelector('#transaction-filter').addEventListener('change', render);
            list.addEventListener('click', event => { if (event.target.matches('.delete-btn')) { const index = entries.findIndex(entry => entry.id === Number(event.target.dataset.id)); entries.splice(index, 1); render(); } });
            document.querySelectorAll('[data-scroll]').forEach(button => button.addEventListener('click', () => document.querySelector(`#${button.dataset.scroll}`).scrollIntoView({ behavior: 'smooth' })));
            render();
        })();
    </script>
</body>
</html>
